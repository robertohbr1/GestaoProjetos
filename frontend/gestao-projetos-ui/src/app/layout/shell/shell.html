<mat-sidenav-container class="sidenav-container">
  <!-- SIDE NAV -->
  <mat-sidenav mode="side" opened class="glass-sidenav">
    <div class="logo-container">
      <mat-icon class="logo-icon">developer_mode</mat-icon>
      <span class="logo-text text-gradient">TI Interna</span>
    </div>

    <mat-nav-list>
      <a mat-list-item routerLink="/issues" routerLinkActive="active-link" [routerLinkActiveOptions]="{exact: false}">
        <mat-icon matListItemIcon>task</mat-icon>
        <span matListItemTitle>Demandas</span>
      </a>

      <a mat-list-item routerLink="/projects" routerLinkActive="active-link">
        <mat-icon matListItemIcon>folder</mat-icon>
        <span matListItemTitle>Projetos</span>
      </a>

      <a mat-list-item routerLink="/reports" routerLinkActive="active-link">
        <mat-icon matListItemIcon>bar_chart</mat-icon>
        <span matListItemTitle>Relatórios</span>
      </a>
    </mat-nav-list>
  </mat-sidenav>

  <!-- CONTENT -->
  <mat-sidenav-content class="main-content">
    <!-- TOOLBAR -->
    <mat-toolbar class="glass-toolbar">
      <span class="spacer"></span>
      <div class="user-info" *ngIf="authService.isLoggedIn()">
        <span class="user-name">{{ authService.currentUser() }}</span>
        <span class="user-role badge status-backlog">{{ authService.userRole() }}</span>
        <button mat-icon-button (click)="logout()" title="Sair do sistema">
          <mat-icon color="warn">logout</mat-icon>
        </button>
      </div>
    </mat-toolbar>

    <!-- CONTENT OUTLET -->
    <div class="content-body">
      <router-outlet></router-outlet>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
